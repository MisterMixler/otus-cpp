name: "C++ CI"

on:
  push:
    branches:
      - lab10
      - feature/github_actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libboost-dev

      - name: Configure
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }}

      - name: Build
        run: cmake --build build

      - name: Run smoke test (async_stress)
        run: |
          mkdir -p build/async_stress_cwd && cd build/async_stress_cwd && ../async_stress

      - name: Run smoke test (bulk_server)
        run: |
          cd build
          ./bulk_server 9876 3 &
          SERVER_PID=$!
          sleep 1
          seq 0 9 | nc -q1 localhost 9876
          sleep 1
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Generate Doxygen docs
        run: cmake --build build --target doxygen

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-html
          path: build/docs/html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy_pages:
    runs-on: ubuntu-latest
    needs: build_and_docs
    if: github.ref == 'refs/heads/lab10'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build_release:
    runs-on: ubuntu-latest
    needs: build_and_docs
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Configure
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }}

      - name: Build
        run: cmake --build build

      - name: Package (CPack)
        run: cmake --build build --target package

      - name: Locate deb package
        id: deb
        run: |
          DEB_PATH="$(ls -1 build/*.deb | head -n 1)"
          echo "path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DEB_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create release and upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: ${{ steps.deb.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
